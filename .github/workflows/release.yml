name: npm release

# npm publish of @modelscope/ms-webui, triggered by pushing a v** tag.
# Requires the NPM_TOKEN secret (an npm automation-granularity token).
# build = fetch-skills (clones the swift repo + modelscope-skills) + vite build;
# skills/ currently lives on the swift repo's dev-swift-v5 branch, so SWIFT_SKILLS_REF
# pins that (the tag exists here, not there).
on:
  push:
    tags:
      - 'v**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-n-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Build (bundle skills)
        run: npm run build
        env:
          SWIFT_SKILLS_REF: dev-swift-v5
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
