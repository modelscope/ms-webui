<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>模块加载自诊断</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #1e1e28; color: #d4d4d8; padding: 24px; }
    .ok { color: #4ade80; }
    .fail { color: #f87171; white-space: pre-wrap; }
    h1 { font-size: 16px; }
    div.entry { margin: 4px 0; }
  </style>
</head>
<body>
  <h1>模块加载自诊断（哪个模块红，错误就在哪）</h1>
  <div id="out"></div>
  <script type="module">
    const modules = [
      '/src/main.tsx',
      '/src/pages/workflow/nodeTypes.tsx',
      '/src/pages/workflow/registryNodes.tsx',
      '/src/pages/workflow/presets.ts',
      '/src/pages/workflow/NodeCanvas.tsx',
      '/src/pages/workflow/NodeInspector.tsx',
      '/src/pages/workflow/nodeOutputs.ts',
      '/src/pages/workflow/aiAssist.ts',
      '/src/pages/workflow/NodePalette.tsx',
      '/src/pages/workflow/WorkflowEditorPage.tsx',
      '/src/pages/workflow/WorkflowListPage.tsx',
      '/src/pages/chat/ChatPage.tsx',
    ];
    const out = document.getElementById('out');
    for (const m of modules) {
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.textContent = 'loading ' + m + ' ...';
      out.appendChild(entry);
      try {
        await import(/* @vite-ignore */ m);
        entry.className = 'entry ok';
        entry.textContent = 'OK    ' + m;
      } catch (e) {
        entry.className = 'entry fail';
        entry.textContent = 'FAIL  ' + m + '\n' + (e && (e.stack || e.message) || String(e));
      }
    }
    const done = document.createElement('div');
    done.textContent = '—— 诊断完成 ——';
    out.appendChild(done);
  </script>
</body>
</html>
